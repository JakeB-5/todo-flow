<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="622" viewBox="0 0 1120 622" role="img" aria-labelledby="title desc">
<title id="title">하나의 백로그, 이어지는 작업 사이클.</title>
<desc id="desc">todo → trackpicks → trackrun → watchlist → todo. 새 후속 트랙은 사용자의 선정을 기다립니다. 워커가 바뀌어도 파일에서 이어받고, 누가 무엇을 하는지 확인할 수 있습니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#668879" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="622" rx="24" fill="#f5f7f3"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, Apple SD Gothic Neo, sans-serif">
<text x="40" y="45" font-size="13" fill="#39745d" font-weight="700">TODO FLOW / WORKFLOW</text>
<text x="40" y="88" font-size="32" fill="#1d3429" font-weight="700">하나의 백로그, 이어지는 작업 사이클.</text>
<text x="40" y="119" font-size="18" fill="#53605b" font-weight="400">사용자는 트랙을 고르고, 에이전트는 작업을 이어가며 근거를 남깁니다.</text>
<rect x="40" y="160" width="230" height="210" rx="16" fill="#ffffff" stroke="#d6e0d9"/>
<rect x="58" y="179" width="194" height="25" rx="6" fill="#eaf2ed"/>
<text x="70" y="197" font-size="12" fill="#39745d" font-weight="700">등록</text>
<text x="60" y="240" font-size="28" fill="#1d3429" font-weight="700">todo</text>
<text x="60" y="278" font-size="17" fill="#53605b" font-weight="400">기존 작업과 중복 검색</text>
<text x="60" y="306" font-size="17" fill="#53605b" font-weight="400">검토 가능한 HTML 계획 작성</text>
<text x="60" y="334" font-size="17" fill="#53605b" font-weight="400">todo 스킬로 트랙 등록</text>
<path d="M272 230 H302" fill="none" stroke="#668879" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="310" y="160" width="230" height="210" rx="16" fill="#ffffff" stroke="#d6e0d9"/>
<rect x="328" y="179" width="194" height="25" rx="6" fill="#fff0cc"/>
<text x="340" y="197" font-size="12" fill="#7b5a16" font-weight="700">선정</text>
<text x="330" y="240" font-size="28" fill="#1d3429" font-weight="700">trackpicks</text>
<text x="330" y="278" font-size="17" fill="#53605b" font-weight="400">계획과 의존성 검토</text>
<text x="330" y="306" font-size="17" fill="#53605b" font-weight="400">진행 가능한 후보 추천</text>
<text x="330" y="334" font-size="17" fill="#53605b" font-weight="400">사용자가 실행할 ID 선택</text>
<path d="M542 230 H572" fill="none" stroke="#668879" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="580" y="160" width="230" height="210" rx="16" fill="#ffffff" stroke="#d6e0d9"/>
<rect x="598" y="179" width="194" height="25" rx="6" fill="#eaf2ed"/>
<text x="610" y="197" font-size="12" fill="#39745d" font-weight="700">실행</text>
<text x="600" y="240" font-size="28" fill="#1d3429" font-weight="700">trackrun</text>
<text x="600" y="278" font-size="17" fill="#53605b" font-weight="400">작업 · 검증 · 독립 리뷰</text>
<text x="600" y="306" font-size="17" fill="#53605b" font-weight="400">트랙별 별도 워크트리</text>
<text x="600" y="334" font-size="17" fill="#53605b" font-weight="400">허용된 랜딩 → 트리아지</text>
<path d="M812 230 H842" fill="none" stroke="#668879" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
<rect x="850" y="160" width="230" height="210" rx="16" fill="#ffffff" stroke="#d6e0d9"/>
<rect x="868" y="179" width="194" height="25" rx="6" fill="#eaf2ed"/>
<text x="880" y="197" font-size="12" fill="#39745d" font-weight="700">재평가</text>
<text x="870" y="240" font-size="28" fill="#1d3429" font-weight="700">watchlist</text>
<text x="870" y="278" font-size="17" fill="#53605b" font-weight="400">조건부 관찰 항목 재평가</text>
<text x="870" y="306" font-size="17" fill="#53605b" font-weight="400">유지 · 해결 · TODO 전환</text>
<text x="870" y="334" font-size="17" fill="#53605b" font-weight="400">현재 근거로 판단</text>
<path d="M965 370 V414 H155 V375" fill="none" stroke="#668879" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="303" y="394" width="514" height="39" rx="19" fill="#f5f7f3"/>
<text x="560" y="419" font-size="18" fill="#315f49" font-weight="600" text-anchor="middle">실행할 후속 요구 → TODO 등록 또는 갱신</text>
<text x="560" y="453" font-size="16" fill="#53605b" font-weight="400" text-anchor="middle">새 후속 트랙은 사용자의 선정을 기다립니다.</text>
<rect x="40" y="482" width="1040" height="108" rx="16" fill="#1d3429"/>
<circle cx="65" cy="514" r="5" fill="#90d7b0"/>
<text x="82" y="521" font-size="20" fill="#ffffff" font-weight="600">프로젝트 파일에 기록, 대시보드에서 확인.</text>
<text x="1060" y="521" font-size="16" fill="#bad1c2" font-weight="400" text-anchor="end">트랙 · 작업권 · 근거 · 결정 · 관찰</text>
<text x="64" y="561" font-size="17" fill="#d6e6dc" font-weight="400">워커가 바뀌어도 파일에서 이어받고, 누가 무엇을 하는지 확인할 수 있습니다.</text>
</g></svg>
