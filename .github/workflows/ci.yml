name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.10.11'
      - name: Install filesystem search tool
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update
              sudo apt-get install -y ripgrep
            else
              brew install ripgrep
            fi
          fi
          rg --version
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: node --check src/todo_flow/web/app.js
      - run: node --test tests/dashboard_i18n.test.cjs
      - run: uv build --out-dir dist/update-check
      - run: uv run python scripts/update_smoke.py --artifacts dist/update-check --root "$RUNNER_TEMP/todo-flow-update-smoke"
