[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "todo-flow"
version = "0.1.1"
description = "Durable TODO work requests, replaceable agents, and observable delivery"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py==4.0.0",
]

[project.urls]
Homepage = "https://github.com/JakeB-5/todo-flow"
Repository = "https://github.com/JakeB-5/todo-flow"
Issues = "https://github.com/JakeB-5/todo-flow/issues"
Changelog = "https://github.com/JakeB-5/todo-flow/blob/main/CHANGELOG.md"
Releases = "https://github.com/JakeB-5/todo-flow/releases"

[project.scripts]
todo-flow = "todo_flow.cli:main"
trackrun = "todo_flow.cli:trackrun"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_flow"]

[dependency-groups]
dev = ["ruff==0.15.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "todo_flow/skills"

[tool.hatch.build.targets.sdist]
only-include = [
    ".github",
    "src/todo_flow",
    "skills",
    "templates",
    "tests",
    "scripts",
    "assets",
    "examples",
    "LICENSE",
    "README.md",
    "README.ko.md",
    "README.ja.md",
    "README.zh-CN.md",
    "AGENT_INSTALL.md",
    "AGENT_INSTALL.ko.md",
    "AGENT_INSTALL.ja.md",
    "AGENT_INSTALL.zh-CN.md",
    "OPERATIONS.md",
    "OPERATIONS.ko.md",
    "OPERATIONS.ja.md",
    "OPERATIONS.zh-CN.md",
    "UPDATES.md",
    "UPDATES.ko.md",
    "UPDATES.ja.md",
    "UPDATES.zh-CN.md",
    "DEMO.md",
    "DEMO.ko.md",
    "DEMO.ja.md",
    "DEMO.zh-CN.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "AGENTS.md",
    "pyproject.toml",
    "uv.lock",
]
